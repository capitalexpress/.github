name: sync-labels

# Applies labels.yml to the org's repos (additive: never deletes labels).
# Needs the LABELS_SYNC_TOKEN secret: a fine-grained PAT or GitHub App token with
# Issues: read and write on all capitalexpress repos. Without it the job is skipped.

on:
  push:
    branches: [main]
    paths: [labels.yml, scripts/sync-labels.sh]
  workflow_dispatch:
    inputs:
      repos:
        description: "Repos (space-separated names), or --all"
        default: "--all"
      dry_run:
        description: "Only show what would change"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.LABELS_SYNC_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Sync labels
        if: env.GH_TOKEN != ''
        env:
          REPOS: ${{ inputs.repos || '--all' }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        # REPOS is intentionally unquoted: it's a list of repo names.
        run: scripts/sync-labels.sh $DRY_RUN $REPOS
      - name: Missing token
        if: env.GH_TOKEN == ''
        run: echo "::warning::LABELS_SYNC_TOKEN is not set; labels were not synced."
